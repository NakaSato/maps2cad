# Render blueprint. Deploy with: Dashboard > New > Blueprint, pointed at
# this repo, or `render blueprint launch`.
#
# This is configured for the FREE plan, which has no persistent disk and
# spins the instance down after about 15 minutes idle. Both of those have
# consequences you should know rather than discover:
#
#   * staging.sqlite is lost on every spin-down and every deploy, and with
#     it verified_names — the field-verified building names that survive
#     re-extraction. On free, treat every run as throwaway and export the
#     building inventory CSV if a name matters.
#   * the DEM tile cache is lost too, so the first CAD export after a cold
#     start re-downloads ~40 MB from Copernicus before it can draw.
#   * so is the map-tile cache under <data>/cache/tiles, which means a
#     background map re-fetches its tiles after every spin-down. Tile
#     servers are shared infrastructure and OpenStreetMap's usage policy
#     asks for caching, so on the free plan use --basemap sparingly, or
#     move to a plan with a disk. The same applies to Overture places,
#     which are on by default: the per-extent cache under /data is lost on
#     every restart, so each cold run pays the ~20-60 s fetch again. It is
#     bounded (overture.FETCH_TIMEOUT) so it can only cost the places.
#   * memory is 512 MB. A CAD run peaks around 165 MB, so this fits, but
#     there is not much headroom for concurrent generations.
#
# To make it durable later, change `plan: free` to `plan: starter` and add:
#
#     disk:
#       name: maps2cad-data
#       mountPath: /data
#       sizeGB: 5
#
# MAPS2CAD_DATA already points at /data, so nothing else needs to change.
services:
  - type: web
    name: maps2cad
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore      # closest to Thailand; also cuts Overpass latency
    healthCheckPath: /health
    envVars:
      - key: MAPS2CAD_DATA
        value: /data       # ephemeral on free — see the note above
      - key: PYTHONUNBUFFERED
        value: "1"
      # An Overpass instance you control, for both exports. The public
      # mirrors decline an address that has asked for too much, and a
      # cloud host shares its outbound address with everyone else on it:
      # this deploy has had overpass-api.de and lz4 answer "connection
      # refused" outright while kumi.systems returned 502 — the 502 being
      # the proof that egress was fine and the refusal was about the
      # caller. No number of public mirrors fixes that.
      #
      # Comma-separated for a primary and a standby. Either URL shape
      # works ("https://host/api" or ".../api/interpreter"). Named
      # endpoints are tried first and the public mirrors stay behind
      # them, so one that is down falls back rather than failing.
      # Unset, the app behaves exactly as before.
      - key: MAPS2CAD_OVERPASS
        sync: false
      # Google sign-in is optional. Set these in the Render dashboard, not
      # here — render.yaml is committed and these are credentials. With them
      # unset the app runs normally and the Drive button is not shown.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
